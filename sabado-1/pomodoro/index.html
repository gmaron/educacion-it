<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #c0392b;
      color: white;
      transition: background 0.5s;
    }
    body.descanso { background: #27ae60; }
    #modo { font-size: 1.5rem; text-transform: uppercase; letter-spacing: 0.2em; }
    #tiempo { font-size: 6rem; font-weight: bold; margin: 1rem 0; }
    button {
      font-size: 1.2rem;
      padding: 0.6rem 1.5rem;
      margin: 0 0.3rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="modo">Trabajo</div>
  <div id="tiempo">25:00</div>
  <div>
    <button id="iniciar">Iniciar</button>
    <button id="reiniciar">Reiniciar</button>
  </div>
  <p id="contador">Pomodoros completados: 0</p>

  <script>
    const TRABAJO = 25 * 60;
    const DESCANSO = 5 * 60;

    let restante = TRABAJO;
    let enDescanso = false;
    let completados = 0;
    let intervalo = null;

    const tiempo = document.getElementById("tiempo");
    const modo = document.getElementById("modo");
    const botonIniciar = document.getElementById("iniciar");
    const contador = document.getElementById("contador");

    function mostrar() {
      const minutos = Math.floor(restante / 60);
      const segundos = restante % 60;
      tiempo.textContent =
        String(minutos).padStart(2, "0") + ":" + String(segundos).padStart(2, "0");
      document.title = tiempo.textContent + " · Pomodoro";
    }

    function cambiarModo() {
      enDescanso = !enDescanso;
      if (!enDescanso) {
        completados++;
        contador.textContent = "Pomodoros completados: " + completados;
      }
      restante = enDescanso ? DESCANSO : TRABAJO;
      modo.textContent = enDescanso ? "Descanso" : "Trabajo";
      document.body.classList.toggle("descanso", enDescanso);
      new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg").play();
    }

    function tic() {
      restante--;
      if (restante < 0) {
        cambiarModo();
      }
      mostrar();
    }

    botonIniciar.addEventListener("click", () => {
      if (intervalo) {
        clearInterval(intervalo);
        intervalo = null;
        botonIniciar.textContent = "Iniciar";
      } else {
        intervalo = setInterval(tic, 1000);
        botonIniciar.textContent = "Pausar";
      }
    });

    document.getElementById("reiniciar").addEventListener("click", () => {
      clearInterval(intervalo);
      intervalo = null;
      enDescanso = false;
      restante = TRABAJO;
      modo.textContent = "Trabajo";
      document.body.classList.remove("descanso");
      botonIniciar.textContent = "Iniciar";
      mostrar();
    });

    mostrar();
  </script>
</body>
</html>
